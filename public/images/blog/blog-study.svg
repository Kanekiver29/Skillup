<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bg2)"/>
  <circle cx="50" cy="30" r="50" fill="white" opacity="0.06"/>
  <circle cx="360" cy="160" r="45" fill="white" opacity="0.05"/>
  <!-- Clock / Timer -->
  <circle cx="200" cy="95" r="50" fill="white" opacity="0.15" stroke="white" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="200" cy="95" r="42" fill="white" opacity="0.1"/>
  <line x1="200" y1="95" x2="200" y2="65" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="95" x2="220" y2="95" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="95" r="4" fill="white" opacity="0.9"/>
  <!-- Book -->
  <rect x="90" y="110" width="40" height="50" rx="4" fill="white" opacity="0.2" transform="rotate(-15 110 135)"/>
  <rect x="95" y="112" width="35" height="46" rx="3" fill="white" opacity="0.1" transform="rotate(-15 110 135)"/>
  <!-- Brain / lightbulb -->
  <text x="300" y="80" font-size="36" opacity="0.8">🧠</text>
  <text x="85" y="75" font-size="22" opacity="0.7">📖</text>
</svg>