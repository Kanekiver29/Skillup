  <circle cx="245" cy="122" r="2" fill="white" opacity="0.5"/>
  <circle cx="255" cy="122" r="2" fill="white" opacity="0.5"/>
  <circle cx="265" cy="122" r="2" fill="white" opacity="0.5"/>
  <!-- Decorative -->
  <text x="310" y="70" font-size="24" opacity="0.7">🤝</text>
