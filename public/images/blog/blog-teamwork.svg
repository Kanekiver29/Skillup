  <line x1="165" y1="95" x2="235" y2="95" stroke="white" stroke-width="1" opacity="0.2" stroke-dasharray="4 3"/>
  <!-- Chat bubbles -->
  <rect x="115" y="110" width="60" height="30" rx="8" fill="white" opacity="0.15"/>
