<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="400" rx="0" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="white" opacity="0.06"/>
  <circle cx="700" cy="320" r="80" fill="white" opacity="0.08"/>
  <circle cx="100" cy="350" r="60" fill="white" opacity="0.05"/>
  <!-- Laptop illustration -->
  <rect x="240" y="100" width="320" height="200" rx="12" fill="#1e1b4b" stroke="white" stroke-opacity="0.2" stroke-width="2"/>
  <rect x="255" y="115" width="290" height="170" rx="6" fill="#312e81"/>
  <!-- Code lines on screen -->
  <rect x="275" y="140" width="80" height="8" rx="4" fill="#818cf8" opacity="0.8"/>
  <rect x="275" y="158" width="120" height="8" rx="4" fill="#c084fc" opacity="0.6"/>
  <rect x="275" y="176" width="60" height="8" rx="4" fill="#f0abfc" opacity="0.5"/>
  <rect x="275" y="194" width="100" height="8" rx="4" fill="#818cf8" opacity="0.7"/>
  <rect x="275" y="212" width="140" height="8" rx="4" fill="#c084fc" opacity="0.5"/>
  <rect x="275" y="230" width="70" height="8" rx="4" fill="#f0abfc" opacity="0.6"/>
  <!-- Preview panel on screen -->
  <rect x="430" y="135" width="100" height="100" rx="8" fill="url(#card)" stroke="white" stroke-opacity="0.1"/>
  <rect x="442" y="150" width="76" height="10" rx="3" fill="white" opacity="0.3"/>
  <rect x="442" y="168" width="55" height="6" rx="3" fill="white" opacity="0.2"/>
  <rect x="442" y="180" width="65" height="6" rx="3" fill="white" opacity="0.2"/>
  <rect x="442" y="200" width="40" height="18" rx="4" fill="#a855f7" opacity="0.6"/>
  <!-- Laptop base -->
  <rect x="200" y="300" width="400" height="14" rx="4" fill="#1e1b4b"/>
  <rect x="350" y="300" width="100" height="4" rx="2" fill="white" opacity="0.1"/>
  <!-- Floating elements -->
  <rect x="120" y="120" width="60" height="60" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15"/>
  <text x="150" y="158" text-anchor="middle" font-size="28" fill="white" opacity="0.8">📄</text>
  <rect x="620" y="150" width="60" height="60" rx="12" fill="url(#card)" stroke="white" stroke-opacity="0.15"/>
  <text x="650" y="188" text-anchor="middle" font-size="28" fill="white" opacity="0.8">🎯</text>
  <rect x="160" y="220" width="50" height="50" rx="10" fill="url(#card)" stroke="white" stroke-opacity="0.15"/>
  <text x="185" y="253" text-anchor="middle" font-size="22" fill="white" opacity="0.8">💡</text>
  <!-- Stars / sparkles -->
  <circle cx="580" cy="100" r="3" fill="white" opacity="0.6"/>
  <circle cx="160" cy="90" r="2" fill="white" opacity="0.5"/>
  <circle cx="680" cy="250" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="130" cy="300" r="2" fill="white" opacity="0.5"/>
</svg>